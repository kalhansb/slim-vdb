# SLIM-VDB config for Replica (NICE-SLAM trajectories) — GT semantics variant.
# Pair with the build-replica (NCLASSES=102) binary.
#
# Build with: -DSLIMVDB_LANGUAGE=CLOSED -DSLIMVDB_NCLASSES=102
# (101 Replica classes + 0 = unknown/void)

# SLIMVDB (TSDF) ------------------------------------------------------------
voxel_size: 0.05
sdf_trunc: 0.15
space_carving: False
prune_interval: -1

# Reconstruction ------------------------------------------------------------
fill_holes: False
min_weight: 5.0
p_threshold: 0.1

# Replica dataset -----------------------------------------------------------
apply_pose: True
preprocess: True
min_range: 0.2
max_range: 8.0
render_img_width: 1200
render_img_height: 680

# Label source: Replica GT class IDs, re-rendered via Habitat-sim from
# mesh_semantic.ply along NICE-SLAM trajectories (uint16, 101-class space + 0=unlabeled).
semantic_subdir: semantic_gt_fixed

color_map: {}
